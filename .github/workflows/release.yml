name: Release

# Builds Linux and Windows packages. On a tag push the release is created once every build has
# passed, with all the files at once; run by hand, the files are only kept as workflow artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner, so the packages also run on older glibc releases.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build .deb and .rpm
        run: npm run tauri build -- --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: scanshark-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build installer
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis

      # The bare exe runs without installing; named by version and arch so both fit in one release.
      - name: Collect installer and portable exe
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out=src-tauri/target/${{ matrix.target }}/release
          mkdir dist-windows
          cp "$out"/bundle/nsis/*.exe dist-windows/
          cp "$out/scanshark.exe" "dist-windows/scanshark_${version}_${{ matrix.arch }}-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: scanshark-windows-${{ matrix.arch }}
          path: dist-windows/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The Linux artifact keeps its deb/ and rpm/ folders, so collect the files themselves.
        run: |
          mapfile -t files < <(find dist -type f)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "ScanShark $GITHUB_REF_NAME" --generate-notes
